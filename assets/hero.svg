<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="SideQuest — South Africa is your map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#f5c542" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4db8ff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- faint map grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- a quest path across the map -->
  <path d="M 90 330 C 260 250, 400 320, 560 235 S 880 200, 1120 70"
        fill="none" stroke="url(#route)" stroke-width="2.5" stroke-dasharray="6 9" stroke-linecap="round"/>

  <!-- waypoints on the path -->
  <circle cx="90" cy="330" r="7" fill="#4db8ff" opacity="0.85"/>
  <circle cx="330" cy="282" r="5" fill="#f5c542" opacity="0.75"/>
  <circle cx="560" cy="235" r="6" fill="#f5c542" opacity="0.9"/>
  <circle cx="1120" cy="70" r="7" fill="#f5c542" opacity="0.8"/>

  <!-- glowing location pin -->
  <circle cx="600" cy="140" r="150" fill="url(#glow)"/>
  <circle cx="600" cy="140" r="34" fill="none" stroke="#f5c542" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="600" cy="140" r="44" fill="none" stroke="#f5c542" stroke-opacity="0.15" stroke-width="1.5"/>
  <path d="M600,84 c-15,0 -27,12 -27,27 c0,19 27,49 27,49 c0,0 27,-30 27,-49 c0,-15 -12,-27 -27,-27 z"
        fill="#f5c542"/>
  <circle cx="600" cy="111" r="9.5" fill="#0d1117"/>

  <!-- brand -->
  <text x="600" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="64" font-weight="800" letter-spacing="12" fill="#ffffff">SIDEQUEST</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="600" letter-spacing="9" fill="#8b93a7">SOUTH AFRICA IS YOUR MAP</text>
  <text x="600" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-style="italic" fill="#f5c542">"Your next adventure is closer than your next class."</text>
  <text x="600" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="700" letter-spacing="6" fill="#5c6478">BY JACY</text>
</svg>
